# PRD v3 §6.2 e §8.5.
#
# A aplicação é servida em /MEJ-AI-INTERFACE/, e não na raiz, porque o
# `vite.config.ts` embute esse base no build: o index.html gerado referencia
# /MEJ-AI-INTERFACE/assets/... em caminho ABSOLUTO. Servir na raiz devolveria
# 404 em todo asset. É também o subdiretório usado pelo servidor de produção.

server {
    listen 80;
    server_name _;

    # §8.5: não expor a versão do nginx no header Server nem nas páginas de erro.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Ver o comentário dentro do arquivo: add_header não é herdado por um
    # location que declare header próprio, então este include se repete abaixo.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-sfnt font/otf;

    # §8.5: nada de listar diretório.
    autoindex off;

    # Quem chegar na raiz vai para onde a aplicação realmente mora.
    location = / {
        return 302 /MEJ-AI-INTERFACE/;
    }

    # Assets com hash no nome: o conteúdo nunca muda para um mesmo nome, então
    # cache longo e imutável é seguro.
    location ^~ /MEJ-AI-INTERFACE/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # As fontes também têm nome estável.
    location ^~ /MEJ-AI-INTERFACE/fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /MEJ-AI-INTERFACE/ {
        include /etc/nginx/snippets/security-headers.conf;

        # O index.html referencia os assets com hash; se ele for cacheado, o
        # navegador continua pedindo o bundle antigo depois de um deploy.
        add_header Cache-Control "no-cache" always;

        # A §5.3 do PRD sugere `try_files $uri $uri/ /index.html`, o fallback
        # padrão de SPA. Aqui ele seria ERRADO: esta aplicação não tem rotas
        # internas (nenhum router instalado), então esse fallback devolveria o
        # app para QUALQUER caminho inexistente e tornaria a página 404
        # inalcançável — anulando a segunda metade da própria §5.3. Com `=404`,
        # caminho que não existe cai na 404 do projeto.
        #
        # Se um dia o app ganhar rotas internas (react-router), troque por
        # `/MEJ-AI-INTERFACE/index.html` e mova a 404 para dentro do router.
        try_files $uri $uri/ =404;
    }

    error_page 404 /MEJ-AI-INTERFACE/404.html;

    location = /MEJ-AI-INTERFACE/404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Erros de servidor não devem vazar detalhe técnico (§8.4).
    error_page 500 502 503 504 /MEJ-AI-INTERFACE/404.html;
}
