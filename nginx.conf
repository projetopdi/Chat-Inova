# Configuração do Nginx para servir o Chat-Inova na rota /chat-dev/
# e fazer proxy reverso das chamadas de API internamente para o contêiner web.

server {
    listen 80;
    server_name _;

    # Não expor a versão do nginx no header Server nem nas páginas de erro.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-sfnt font/otf;

    autoindex off;

    # Quem chegar na raiz vai para o subdiretório público da aplicação.
    location = / {
        return 302 /chat/;
    }

    # Retrocompatibilidade com links legados
    location = /MEJ-AI-INTERFACE {
        return 301 /chat/;
    }
    location /MEJ-AI-INTERFACE/ {
        return 301 /chat/;
    }
    location = /chat-dev {
        return 301 /chat/;
    }
    location /chat-dev/ {
        return 301 /chat/;
    }

    # Proxy para as chamadas de API do backend (chatbots)
    location /chat/api/ {
        proxy_pass http://web:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /chat-dev/api/ {
        proxy_pass http://web:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://web:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Assets com hash no nome: cache longo e imutável
    location ^~ /chat/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Fontes com nome estável
    location ^~ /chat/fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /chat/ {
        include /etc/nginx/snippets/security-headers.conf;

        # O index.html referencia os assets com hash; não pode ser cacheado agressivamente
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ =404;
    }

    error_page 404 /chat/404.html;

    location = /chat/404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Erros de servidor não devem vazar detalhe técnico
    error_page 500 502 503 504 /chat/404.html;
}
